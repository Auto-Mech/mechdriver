[project]
name = "autofile"
version = "2025.7.28"
description = "Filesystem database manager for AutoMech "
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["autofile"]

[tool.hatch.build.targets.wheel]
include = ["autofile"]

[dependency-groups]
dev = [
    "pytest",
]
