name: test-unit-autoio

on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-unit-autoio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.9

      # Test
      - name: Test
        run: |
          pixi run -e test pytest -v src/_autoio/mess_io
          pixi run -e test pytest -v src/_autoio/autoparse
          pixi run -e test pytest -v src/_autoio/autoread
          pixi run -e test pytest -v src/_autoio/autowrite
          pixi run -e test pytest -v src/_autoio/ioformat
          pixi run -e test pytest -v src/_autoio/chemkin_io
          pixi run -e test pytest -v src/_autoio/projrot_io
          pixi run -e test pytest -v src/_autoio/polyrate_io
          pixi run -e test pytest -v src/_autoio/thermp_io
          pixi run -e test pytest -v src/_autoio/onedmin_io
