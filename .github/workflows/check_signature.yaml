name: check-signature 

on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-signature:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.9

      - name: Check signature
        run: |
          pixi run -e test pytest -v tests/ -k "signature"
