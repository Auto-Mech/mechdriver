name: build

on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      # Repository
      - name: Checkout the code
        uses: actions/checkout@v4

      # Environment
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          environments: build
          frozen: true

      # Build
      - name: Build
        run: |
          pixi build
