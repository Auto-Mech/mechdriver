[project]
name = "mechdriver"
version = "0.2026.0"
description = "Automated workflow routines for calculating theoretical data for reaction mechanisms"
readme = "README.md"
dependencies = ["hyperqueue"]
requires-python = ">=3.11,<3.14"

[project.scripts]
mechdriver = 'mechdriver.cli:main'
mechanalyzer = "mechanalyzer.cli:main"

[dependency-groups]
new_arch = ["hyperqueue>=0.24.0"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Hatchling configurations
[tool.hatch.build.targets.wheel]
packages = ["src/mechdriver", "src/mechlib", "src/mechroutines"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

# Pixi configurations
[tool.pixi.workspace]
channels = ["conda-forge", "Auto-Mech"]
platforms = ["linux-64"]
preview = ["pixi-build"]

#   - Build
[tool.pixi.package]
name = "mechdriver"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.host-dependencies]
hatchling = "==1.26.3"

[tool.pixi.package.run-dependencies]
click = ">=8.2.1"
matplotlib = ">=3.10.6"
more-itertools = ">=10.8.0"
networkx = ">=3.3"
numpy = ">=1.26"
pandas = ">=2.3.3"
pint = ">=0.25"
pydantic = ">=2.12.0"
pyparsing = ">=3.2.5"
pyyaml = ">=6.0.3"
rdkit = ">=2025.9.1"
scipy = ">=1.12"
pac99 = ">=1.6.0"
projrot = ">=1.8.0"
thermp = ">=0.7.0"
mess-static = ">=2026.2.4"
autochem = "==0.2026.2"
autoio = "==0.2026.0"
autofile = "==0.2025.0"
mechanalyzer = "==0.2026.0"

#   - Environments
[tool.pixi.pypi-dependencies]
mechdriver = { path = ".", editable = true }

[tool.pixi.dependencies]
click = ">=8.2.1"
matplotlib = ">=3.10.6"
more-itertools = ">=10.8.0"
networkx = ">=3.3"
numpy = ">=1.26"
pandas = ">=2.3.3"
pint = ">=0.25"
pydantic = ">=2.12.0"
pyparsing = ">=3.2.5"
pyyaml = ">=6.0.3"
rdkit = ">=2025.9.1"
scipy = ">=1.12"
pac99 = ">=1.6.0"
projrot = ">=1.8.0"
thermp = ">=0.7.0"
mess-static = ">=2026.2.4"
autochem = "==0.2026.2"
autoio = "==0.2026.0"
autofile = "==0.2025.0"
mechanalyzer = "==0.2026.0"

[tool.pixi.feature.build.dependencies]
rattler-build = ">=0.47.1"
bumpver = ">=2025.1131,<2026"

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.dev.dependencies]
ipykernel = "*"
jupytext = "*"

[tool.pixi.feature.dev.pypi-dependencies]
autochem = { path = "../autochem", editable = true }
autoio = { path = "../autoio", editable = true }
autofile = { path = "../autofile", editable = true }
mechanalyzer = { path = "../mechanalyzer", editable = true }

[tool.pixi.feature.dev.pypi-options.dependency-overrides]
autochem = { path = "../autochem", editable = true }
autoio = { path = "../autoio", editable = true }
autofile = { path = "../autofile", editable = true }
mechanalyzer = { path = "../mechanalyzer", editable = true }

[tool.pixi.system-requirements]
linux = "3.10"
libc = { family="glibc", version="2.17" }

[tool.pixi.feature.new_arch.system-requirements]
linux = "3.10"
libc = { family="glibc", version="2.28" }

[tool.pixi.environments]
test = ["test"]
dev = ["dev"]
dev2 = ["dev", "new_arch"]
build = ["build"]

#   - Tasks
[tool.pixi.tasks]
node = { cmd = "./scripts/node.sh" }
dev-setup-repos = { cmd = "./scripts/dev-setup-repos.sh", cwd = "." }
dev-setup-hq = { cmd = "./scripts/dev-setup-hq.sh", cwd = "." }
dev-setup-config = { cmd = "./scripts/dev-setup-config.sh", cwd = "." }
dev-setup = { depends-on = ["dev-setup-repos", "dev-setup-hq", "dev-setup-config"] }
git = { cmd = "./scripts/git.sh", cwd = "." }
pull = { cmd = "./scripts/pull.sh", cwd = "." }

[tool.pixi.feature.test.tasks]
test = { cmd = "./scripts/test.py" }

[tool.pixi.feature.dev.tasks]
vis = { cmd = "./scripts/vis.sh" }
dev-test = { cmd = "./scripts/test.py" }

[tool.pixi.feature.build.tasks]
upload = "rattler-build upload anaconda -o Auto-Mech *.conda"
current-version = "bumpver show -n | awk -F': ' '/Current Version: / {print $2}'"
update = { cmd = "./scripts/update.sh", cwd = "." }

[tool.bumpver]
current_version = "0.2026.0"
version_pattern = "MAJOR.YYYY.PATCH"
commit_message = "Release {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = "scripts/update_lockfile.sh"
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/mechdriver/__init__.py" = [
    '__version__ = "{version}"',
]
