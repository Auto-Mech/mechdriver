[project]
name = "mechdriver"
version = "2025.10.0"
description = "Automated workflow routines for calculating theoretical data for reaction mechanisms"
readme = "README.md"
dependencies = ["hyperqueue"]
requires-python = ">=3.11,<3.14"

[project.scripts]
automech = 'mechdriver.cli:main'

[dependency-groups]
test = ["pytest"]
dev = ["ipykernel", "jupytext"]
new_arch = ["hyperqueue>=0.24.0"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Hatchling configurations
[tool.hatch.build.targets.wheel]
packages = ["src/mechdriver", "src/mechlib", "src/mechroutines"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

# Pixi configurations
[tool.pixi.workspace]
channels = ["conda-forge", "Auto-Mech"]
platforms = ["linux-64"]
preview = ["pixi-build"]

#   - Build
[tool.pixi.package]
name = "mechdriver"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.host-dependencies]
hatchling = "==1.26.3"

[tool.pixi.package.run-dependencies]
click = ">=8.2.1"
matplotlib = ">=3.10.6"
more-itertools = ">=10.8.0"
networkx = ">=3.3"
numpy = ">=1.26"
pandas = ">=2.3.3"
pint = ">=0.25"
pydantic = ">=2.12.0"
pyparsing = ">=3.2.5"
pyyaml = ">=6.0.3"
rdkit = ">=2025.9.1"
scipy = ">=1.12"
pac99 = ">=1.6.0"
projrot = ">=1.8.0"
thermp = ">=0.7.0"
mess-static = ">=2025.9.0"
autochem = "==2025.10.2"
autoio = "==2025.10.2"
autofile = "==2025.10.1"
mechanalyzer = "==2025.10.1"

#   - Environments
[tool.pixi.pypi-dependencies]
mechdriver = { path = ".", editable = true }

[tool.pixi.dependencies]
click = ">=8.2.1"
matplotlib = ">=3.10.6"
more-itertools = ">=10.8.0"
networkx = ">=3.3"
numpy = ">=1.26"
pandas = ">=2.3.3"
pint = ">=0.25"
pydantic = ">=2.12.0"
pyparsing = ">=3.2.5"
pyyaml = ">=6.0.3"
rdkit = ">=2025.9.1"
scipy = ">=1.12"
pac99 = ">=1.6.0"
projrot = ">=1.8.0"
thermp = ">=0.7.0"
mess-static = ">=2025.9.0"
autochem = "==2025.10.2"
autoio = "==2025.10.2"
autofile = "==2025.10.1"
mechanalyzer = "==2025.10.1"

[tool.pixi.feature.build.dependencies]
rattler-build = ">=0.47.1"

[tool.pixi.feature.dev.dependencies]
autochem = { path = "../autochem" }
autoio = { path = "../autoio" }
autofile = { path = "../autofile" }
mechanalyzer = { path = "../mechanalyzer" }

[tool.pixi.system-requirements]
linux = "3.10"
libc = { family="glibc", version="2.17" }

[tool.pixi.feature.new_arch.system-requirements]
linux = "3.10"
libc = { family="glibc", version="2.28" }

[tool.pixi.environments]
test = ["test"]
dev = ["dev"]
dev2 = ["dev", "new_arch"]
build = ["build"]

#   - Tasks
[tool.pixi.tasks]
node = { cmd = "./scripts/node.sh" }
dev-setup-repos = { cmd = "./scripts/dev-setup-repos.sh", cwd = "." }
dev-setup-hq = { cmd = "./scripts/dev-setup-hq.sh", cwd = "." }
dev-setup = { depends-on = ["dev-setup-repos", "dev-setup-hq"] }
git = { cmd = "./scripts/git.sh", cwd = "." }
update = { cmd = "./scripts/update.sh", cwd = "." }

[tool.pixi.feature.test.tasks]
test = { cmd = "./scripts/test.py" }

[tool.pixi.feature.dev.tasks]
vis = { cmd = "./scripts/vis.sh" }
dev-test = { cmd = "./scripts/test.py" }

[tool.pixi.feature.build.tasks]
upload = "rattler-build upload anaconda -o Auto-Mech *.conda"
