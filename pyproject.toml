[project]
authors = [{name = "Andreas Copan", email = "avcopan@gmail.com"}]
name = "mechdriver"
requires-python = ">= 3.11"
version = "2025.6.12"
dependencies = ["hyperqueue>=0.20.0,<0.21"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.scripts]
automech = 'mechdriver.cli:main'

[dependency-groups]
test = ["pytest", "pytest-xdist[psutil]"]
lint = ["ruff", "mypy", "pre-commit"]
docs = ["sphinx", "myst-parser", "sphinx-book-theme", "sphinx-autodoc-typehints"]

# Pixi configurations
[tool.pixi.workspace]
channels = ["conda-forge", "auto-mech"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
mechdriver = { path = ".", editable = true }
autochem = { path = "src/_autochem", editable = true }
autoio = { path = "src/_autoio", editable = true }
autofile = { path = "src/_autofile", editable = true }
mechanalyzer = { path = "src/_mechanalyzer", editable = true }

# Tasks
[tool.pixi.tasks]
pull = { cmd = "./scripts/pull.sh", cwd = "." }
push = { cmd = "./scripts/push.sh", cwd = "." }
status = { cmd = "./scripts/status.sh", cwd = "." }
validate = { cmd = "./scripts/validate.sh", cwd = "." }
node = { cmd = "./scripts/node.sh" }
subtasks = { cmd = "./scripts/subtasks.sh" }
test = { cmd = "./scripts/test.py" }

[tool.pixi.dependencies]
python = "3.11.*"
# AutoChem dependencies
numpy = "1.26.*"
scipy = "1.12.*"
networkx = "3.3.*"
xarray = "2023.8.*"
ipython = "8.15.*"
altair-all = "*"
pint = "*"
ipywidgets = "*"
jupyter = "*"
more-itertools = "*"
py3dmol = "*"
pyparsing = "*"
pyyaml = "*"
qcelemental = "*"
rdkit = "*"
# AutoIO dependencies
mako = "*"
# AutoFile dependencies
# MechAnalyzer dependencies
pandas = "2.1.*"
matplotlib = "3.8.*"
click = "*"
python-igraph = "*"
# MechDriver dependencies
pydantic = "*"
automech-toolbox = "*"
parallel = "*"

[tool.pixi.system-requirements]
linux = "3.10"
libc = { family="glibc", version="2.17" }

[tool.pixi.feature.build.dependencies]
cmake = ">=3.30.0,<3.31"
cxx-compiler = ">=1.7.0,<1.8"
fortran-compiler = ">=1.7.0,<1.8"
c-compiler = ">=1.7.0,<1.8"
make = ">=4.3,<5"
rattler-build = ">=0.18.1,<0.19"
libgfortran = ">=3.0.0,<3.1"
libgcc = ">=7.2.0,<7.3"
libstdcxx-ng = ">=14.1.0,<14.2"

[tool.pixi.feature.proto.dependencies]
tqdm = "*"
pandera = "*"
polars = "<1.29"
cantera = "*"
pyarrow = "*"

[tool.pixi.feature.dev.dependencies]
gh = "*"

[tool.pixi.environments]
test = ["test"]
dev = ["test", "lint", "docs", "dev"]
build = ["build"]
proto = ["proto"]

# Ruff configurations
[tool.ruff]
target-version = "py311"
extend-select = [
    "E",      # style errors
    "F",      # flakes
    "D",      # pydocstyle
    "I001",   # isort
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "A001",   # flake8-builtins
    "RUF",    # ruff-specific rules
    "RUF100", # Unused noqa directive
]
extend-ignore = [
    "RUF022", # Require __all__ to be sorted
]
